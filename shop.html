<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- Page title and description: what Google and social media show -->
<title>Shop All | Remain Rogue</title>
<meta name="description" content="Shop Remain Rogue golf polos, tees and caps. Free shipping Australia-wide on orders over $99.">
<link rel="canonical" href="https://www.remainrogue.com.au/shop">

<meta property="og:site_name" content="Remain Rogue">
<meta property="og:type" content="website">
<meta property="og:title" content="Shop All | Remain Rogue">
<meta property="og:description" content="Shop Remain Rogue golf polos, tees and caps. Free shipping Australia-wide on orders over $99.">
<meta property="og:url" content="https://www.remainrogue.com.au/shop">
<meta property="og:image" content="https://www.remainrogue.com.au/assets/img/og-image.png">
<meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="#d5feaf">
<link rel="icon" href="/assets/img/favicon-48.png" type="image/png">
<link rel="apple-touch-icon" href="/assets/img/apple-touch-icon.png">
<!-- Fonts load early so the logo doesn't flicker -->
<link rel="preload" href="/assets/fonts/anton-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/assets/fonts/archivo-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preconnect" href="https://static.wixstatic.com">
<link rel="stylesheet" href="/assets/css/style.css?v=4">

</head>
<body>
<!-- Header is drawn by /assets/js/site.js -->
<div id="site-header"></div>

<main id="main">
<section class="pagehead"><div class="wrap"><h1 id="shop-title">Shop all</h1><p>Polos, tees and caps for the course and everywhere after.</p></div></section>
<section class="sec" style="padding-top:28px">
  <div class="wrap">
    <!-- Category filter buttons. Categories come from products.json -->
    <div class="filters" id="filters" role="group" aria-label="Filter by category"></div>
    <h2 class="visually-hidden">Products</h2>
    <p class="count" id="count" aria-live="polite"></p>
    <div class="grid" id="grid"></div>
  </div>
</section>
</main>

<!-- Footer is drawn by /assets/js/site.js -->
<div id="site-footer"></div>
<script src="/assets/js/site.js?v=4" defer></script>
<script src="/assets/js/shop.js?v=4" defer></script>
</body>
</html>
